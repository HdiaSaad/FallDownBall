workflows:
  ios-testflight:
    name: iOS TestFlight (signed)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - app_store_connect
      node: 22.22.3
      xcode: latest
    scripts:
      - name: Install node deps
        script: npm ci
      - name: Build web bundle
        script: npm run build
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Resolve Swift packages
        script: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
      - name: Fetch signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.saad.skyfallball \
            --platform IOS \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number com.saad.skyfallball --platform IOS 2>/dev/null || echo 0)
          agvtool new-version -all $((LATEST + 1))
      - name: Build and export signed IPA
        script: |
          set -ex
          # Extract DEVELOPMENT_TEAM from the downloaded provisioning profile
          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -1)
          echo "Profile: $PROFILE_PATH"
          TEAM_ID=$(security cms -D -i "$PROFILE_PATH" | python3 -c "
import sys, plistlib
data = plistlib.loads(sys.stdin.buffer.read())
print(data.get('TeamIdentifier', [''])[0])
")
          echo "Team ID: $TEAM_ID"
          # Archive with explicit team + manual signing
          cd ios/App
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            OTHER_CODE_SIGN_FLAGS="--keychain ~/Library/Keychains/cms-build.keychain" \
            2>&1 | tail -60
          # Export IPA
          xcode-project build-ipa \
            --archive-path "$CM_BUILD_DIR/App.xcarchive" \
            --export-ipaPath "$CM_BUILD_DIR"
      - name: Upload to TestFlight
        script: |
          app-store-connect publish \
            --path "$CM_BUILD_DIR/**/*.ipa" \
            --platform IOS \
            --max-build-processing-wait 0
    artifacts:
      - $CM_BUILD_DIR/**/*.ipa
      - $CM_BUILD_DIR/**/*.dSYM.zip
    publishing:
      email:
        recipients:
          - saad.hdia@gmail.com
        notify:
          success: true
          failure: true

  ios-unsigned:
    name: iOS unsigned (sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22.22.3
      xcode: latest
    scripts:
      - name: Install node deps
        script: npm ci
      - name: Build web bundle
        script: npm run build
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Resolve Swift packages
        script: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
      - name: Build unsigned archive
        script: |
          cd ios/App
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""
      - name: Package unsigned .ipa for Sideloadly
        script: |
          cd "$CM_BUILD_DIR"
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/App.app Payload/
          zip -qry SkyFallBall-unsigned.ipa Payload
          rm -rf Payload
    artifacts:
      - $CM_BUILD_DIR/SkyFallBall-unsigned.ipa
    publishing:
      email:
        recipients:
          - saad.hdia@gmail.com
        notify:
          success: true
          failure: true
