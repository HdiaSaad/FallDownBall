<ion-content class="home-content" [fullscreen]="true">
  <div class="home-wrap">
    <div class="logo-ring">
      <img src="assets/logo.png" alt="SkyFallBall" class="logo-img" />
    </div>
    <div class="stats">
      <div class="stat">
        <span class="label">{{ 'common.coins' | translate }}</span>
        <span class="value">{{ wallet.coins() }}</span>
      </div>
      <div class="stat">
        <span class="label">{{ 'common.best' | translate }}</span>
        <span class="value">{{ wallet.best() }}</span>
        <ion-button fill="clear" size="small" (click)="shareBest()" [disabled]="wallet.best() === 0">
          <ion-icon slot="icon-only" name="share-outline"></ion-icon>
        </ion-button>
      </div>
    </div>
    <app-missions-panel></app-missions-panel>
    <ion-button expand="block" size="large" class="play-btn" (click)="play()">
      <ion-icon slot="start" name="play-outline"></ion-icon> {{ 'home.play' | translate }}
    </ion-button>
    <div class="icon-row">
      <ion-button fill="clear" shape="round" routerLink="/settings"><ion-icon name="settings-outline"></ion-icon></ion-button>
      <ion-button fill="clear" shape="round" routerLink="/customize"><ion-icon name="shirt-outline"></ion-icon></ion-button>
      <ion-button fill="clear" shape="round" routerLink="/gift"><ion-icon name="gift-outline"></ion-icon></ion-button>
      <ion-button fill="clear" shape="round" routerLink="/achievements"><ion-icon name="trophy-outline"></ion-icon></ion-button>
    </div>
  </div>
</ion-content>
