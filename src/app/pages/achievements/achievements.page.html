<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start"><ion-back-button defaultHref="/"></ion-back-button></ion-buttons>
    <ion-title>{{ 'achievements.title' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true">
  <div class="grid">
    @for (a of items; track a.id) {
      <div class="tile" [class.unlocked]="isUnlocked(a.id)">
        <ion-icon [name]="isUnlocked(a.id) ? 'trophy' : 'lock-closed-outline'" class="icon"></ion-icon>
        <strong>{{ a.nameKey | translate }}</strong>
        <p>{{ a.descKey | translate }}</p>
        @if (isUnlocked(a.id)) {
          <span class="check"><ion-icon name="checkmark-circle"></ion-icon> +{{ a.reward }}</span>
        }
      </div>
    }
  </div>
</ion-content>
