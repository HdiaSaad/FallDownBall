workflows:
  ios-testflight:
    name: iOS TestFlight (signed)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - app_store_connect
      node: 22.22.3
      xcode: latest
    scripts:
      - name: Install node deps
        script: npm ci
      - name: Build web bundle
        script: npm run build
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Resolve Swift packages
        script: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
      - name: Fetch signing files
        script: |
          keychain initialize
          echo "$DIST_CERT_PRIVATE_KEY" > /tmp/dist_key.pem
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --certificate-key "$(cat /tmp/dist_key.pem)" \
            --save || \
          app-store-connect certificates list \
            --type IOS_DISTRIBUTION \
            --certificate-key "$(cat /tmp/dist_key.pem)" \
            --save
          keychain add-certificates
          app-store-connect fetch-signing-files com.saad.skyfallball \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key "$(cat /tmp/dist_key.pem)" \
            --create
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number com.saad.skyfallball --platform IOS 2>/dev/null || echo 0)
          agvtool new-version -all $((LATEST + 1))
      - name: Build and export signed IPA
        script: |
          set -e
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > /tmp/AuthKey.p8
          echo "$DIST_CERT_PRIVATE_KEY" > /tmp/dist_key.pem
          TEAM_ID=$(security find-identity -v -p codesigning | grep "iPhone Distribution" | head -1 | grep -oE '\([A-Z0-9]+\)' | tr -d '()')
          echo "Team ID: $TEAM_ID"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '<key>method</key><string>app-store</string>' \
            "<key>teamID</key><string>$TEAM_ID</string>" \
            '</dict></plist>' > /tmp/ExportOptions.plist
          cd ios/App
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution"
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            -exportPath "$CM_BUILD_DIR/ipa" \
            -exportOptionsPlist /Users/builder/export_options.plist
      - name: Upload to TestFlight
        script: |
          app-store-connect publish \
            --path "$CM_BUILD_DIR/ipa/*.ipa" \
            --platform IOS \
            --max-build-processing-wait 0
    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
      - $CM_BUILD_DIR/**/*.dSYM.zip
    publishing:
      email:
        recipients:
          - saad.hdia@gmail.com
        notify:
          success: true
          failure: true

  ios-unsigned:
    name: iOS unsigned (sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22.22.3
      xcode: latest
    scripts:
      - name: Install node deps
        script: npm ci
      - name: Build web bundle
        script: npm run build
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Resolve Swift packages
        script: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
      - name: Build unsigned archive
        script: |
          cd ios/App
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""
      - name: Package unsigned .ipa for Sideloadly
        script: |
          cd "$CM_BUILD_DIR"
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/App.app Payload/
          zip -qry SkyFallBall-unsigned.ipa Payload
          rm -rf Payload
    artifacts:
      - $CM_BUILD_DIR/SkyFallBall-unsigned.ipa
    publishing:
      email:
        recipients:
          - saad.hdia@gmail.com
        notify:
          success: true
          failure: true
